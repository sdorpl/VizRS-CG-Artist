name: CI
on:
  push:
  pull_request:

jobs:
  test:
    # Ubuntu 24.04: libwebkitgtk-6.0-dev jest w archiwum (22.04 go nie ma).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Biblioteki GTK 4 i WebKitGTK 6.0
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Wersja CG System dla modułów strony
        id: cg
        run: echo "ref=$(cat web/CG_SYSTEM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: sdorpl/VizRS-CG-System
          ref: ${{ steps.cg.outputs.ref }}
          path: cg
      - name: Moduły strony zgodne z CG System
        run: tools/sync-cg.sh --check cg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Wersja i suma kontrolna
        run: |
          ./target/release/vizrs-cg-artist --version
          ./target/release/vizrs-cg-artist --help > /dev/null
          sha256sum target/release/vizrs-cg-artist
      - name: Paczka .deb
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          packaging/deb/build.sh target/release/vizrs-cg-artist "" dist
          dpkg-deb -I dist/*.deb
          mkdir dist/x && dpkg-deb -x dist/*.deb dist/x
          desktop-file-validate dist/x/usr/share/applications/*.desktop
          rm -rf dist/x
      - uses: actions/upload-artifact@v4
        with:
          name: vizrs-cg-artist-linux-x86_64
          path: |
            target/release/vizrs-cg-artist
            dist/*.deb
