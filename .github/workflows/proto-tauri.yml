name: Prototyp Tauri
# Prototyp okna na Tauri 2 (proto/tauri): budowa, paczki i test dymny na Linux, Windows i macOS.
# Wynik rozstrzyga przejście z GTK 4 (docs/plany/RAPORT-tauri.md). Paczki jako artefakty, bez wydania.
on:
  push:
    branches: [main]
    paths: ['proto/tauri/**', 'src/**', 'web/**', 'tests/e2e/smoke.js', '.github/workflows/proto-tauri.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: WebKitGTK 4.1 jest od 22.04 – starsza glibc niż okno GTK 4 (24.04+)
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Biblioteki WebKitGTK 4.1 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb xauth dbus-x11 file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Budowa i paczki
        working-directory: proto/tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx --yes @tauri-apps/cli@2 build
      - name: Rozmiary
        run: |
          ls -la proto/tauri/target/release/ | grep -i vizrs || true
          find proto/tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) -exec ls -la {} \;
      - name: Test dymny (Linux, Xvfb)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" node tests/e2e/smoke.js proto/tauri/target/release/vizrs-cg-artist
      - name: Test dymny (Windows, macOS)
        if: runner.os != 'Linux'
        run: |
          bin=proto/tauri/target/release/vizrs-cg-artist; [ -f "$bin.exe" ] && bin="$bin.exe"
          node tests/e2e/smoke.js "$bin"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proto-tauri-${{ matrix.name }}
          path: |
            proto/tauri/target/release/bundle/**/*.deb
            proto/tauri/target/release/bundle/**/*.rpm
            proto/tauri/target/release/bundle/**/*.AppImage
            proto/tauri/target/release/bundle/**/*.msi
            proto/tauri/target/release/bundle/nsis/*.exe
            proto/tauri/target/release/bundle/**/*.dmg
          if-no-files-found: ignore
