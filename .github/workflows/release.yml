name: Release
# Wydanie po wypchnięciu znacznika v* (np. v0.2.0) albo ręcznie (Actions → Release → Run workflow):
#   ręcznie bez `publish` – szkic; z `publish` – wydanie i znacznik na commicie z wybranej gałęzi.
#   paczki bundlera Tauri: Linux (.deb, .rpm, .AppImage – Ubuntu 22.04+, WebKitGTK 4.1), Windows (.msi, instalator
#   NSIS .exe; WebView2), macOS (.dmg, 11.0+; bez podpisu Apple) – jedno wydanie, nazwy z wersją i systemem.
#   sumy SHA256SUMS.txt. Wersja z łącznikiem (v0.3.0-rc1) = wydanie wstępne.
# Wersja musi się zgadzać z `version` w Cargo.toml i tauri.conf.json (program pokazuje ją w --version i „O programie”).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja (np. 0.2.0) – bez znacznika powstaje tylko szkic wydania'
        required: true
      publish:
        description: 'Opublikuj od razu: znacznik powstaje na tym commicie, szkic tej wersji jest zastępowany'
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  bin:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: najstarsza glibc z WebKitGTK 4.1 – paczka działa też na nowszych
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Bez zamiany końców wierszy (Windows – strona w binarce bajt w bajt jak na Linuksie)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Wersja = Cargo.toml = tauri.conf.json
        run: |
          v=${VERSION#v}; c=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          t=$(sed -n 's/^ *"version": *"\(.*\)".*/\1/p' tauri.conf.json | head -1)
          [ "$v" = "$c" ] && [ "$v" = "$t" ] || { echo "::error::wersja $v ≠ Cargo.toml $c / tauri.conf.json $t – podnieś version"; exit 1; }
      - name: Biblioteki okna (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file desktop-file-utils
      - name: Wersja CG System dla modułów strony
        id: cg
        run: echo "ref=$(cat web/CG_SYSTEM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: sdorpl/VizRS-CG-System
          ref: ${{ steps.cg.outputs.ref }}
          path: cg
      - name: Moduły strony zgodne z CG System
        run: tools/sync-cg.sh --check cg
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Paczki (bundler Tauri)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx --yes @tauri-apps/cli@2 build --ci
      - name: Zebranie paczek
        run: |
          v=${VERSION#v}; n=${{ matrix.name }}; mkdir -p dist
          find target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.dmg' \) -exec cp {} dist/ \;
          for f in target/release/bundle/nsis/*.exe; do [ -f "$f" ] && cp "$f" "dist/VizRS-CG-Artist-$v-$n-setup.exe"; done
          if [ "$RUNNER_OS" = Linux ]; then
            ls dist/*.AppImage >/dev/null 2>&1 || { echo "::error::brak AppImage"; exit 1; }
            chmod +x dist/*.AppImage
            mkdir x && dpkg-deb -x dist/*.deb x && desktop-file-validate x/usr/share/applications/*.desktop && rm -rf x
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: dist/*

  release:
    needs: [bin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'bin-*'
          merge-multiple: true
      - name: Sumy kontrolne
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Usuń szkic tej wersji (publikacja ręczna)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .name == \"$VERSION\") | .id" |
            xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/{}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          # znacznik tworzony przy publikacji wskazuje zbudowany commit, nie gałąź domyślną
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          prerelease: ${{ contains(env.VERSION, '-') }}
          make_latest: ${{ !contains(env.VERSION, '-') && (github.event_name == 'push' || inputs.publish) }}
          generate_release_notes: true
          files: dist/*
          body: |
            **Debian / Ubuntu 22.04+:** `sudo apt install ./*_amd64.deb`; Fedora: `.rpm`; inne dystrybucje: `.AppImage`.
            **Windows 10/11:** `.msi` albo instalator `-setup.exe` (WebView2 pobiera się sam, jeśli go brak).
            **macOS 11+ (Apple Silicon):** `.dmg`; program bez podpisu Apple – pierwsze uruchomienie: prawy klik → Otwórz. Trio i wyjście dla OBS: [VizRS CG System](https://github.com/sdorpl/VizRS-CG-System).
