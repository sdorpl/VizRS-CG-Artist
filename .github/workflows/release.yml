name: Release
# Wydanie po wypchnięciu znacznika v* (np. v0.2.0) albo ręcznie (Actions → Release → Run workflow):
#   ręcznie bez `publish` – szkic; z `publish` – wydanie i znacznik na commicie z wybranej gałęzi.
#   paczki bundlera Tauri: Linux (.deb, .rpm, .AppImage – Ubuntu 22.04+, WebKitGTK 4.1), Windows (.msi, instalator
#   NSIS .exe; WebView2), macOS (.dmg, 11.0+; bez podpisu Apple) – jedno wydanie, nazwy z wersją i systemem.
#   sumy SHA256SUMS.txt. Wersja z łącznikiem (v26.12.1-rc1) = wydanie wstępne.
# Bramka: CI (ci.yml przez workflow_call) – fmt, clippy, testy, zgodność z CG System, paczki bundlera z testem dymnym
# na trzech systemach i e2e. Wydanie dostaje paczki z joba build tego przebiegu (bez drugiej budowy), tylko gdy CI zielone.
# Wersja (bez części po łączniku) musi się zgadzać z `version` w Cargo.toml i tauri.conf.json (program pokazuje ją
# w --version i „O programie”); znacznik zawsze v<wersja>.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja (np. 0.2.0) – bez znacznika powstaje tylko szkic wydania'
        required: true
      publish:
        description: 'Opublikuj od razu: znacznik powstaje na tym commicie, szkic tej wersji jest zastępowany'
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  wersja:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.w.outputs.v }}
      tag: ${{ steps.w.outputs.tag }}
      pre: ${{ steps.w.outputs.pre }}
      latest: ${{ steps.w.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - name: Wersja = Cargo.toml = tauri.conf.json
        id: w
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          V=${VERSION#v}; VB=${V%%-*}
          c=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          t=$(sed -n 's/^ *"version": *"\(.*\)".*/\1/p' tauri.conf.json | head -1)
          [ "$VB" = "$c" ] && [ "$VB" = "$t" ] || { echo "::error::wersja $VERSION ≠ Cargo.toml $c / tauri.conf.json $t – podnieś version"; exit 1; }
          pre=false; case "$V" in *-*) pre=true;; esac
          latest=false; [ "$PUBLISH" = true ] && [ "$pre" = false ] && latest=true
          { echo "v=$V"; echo "tag=v$V"; echo "pre=$pre"; echo "latest=$latest"; } | tee -a "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [wersja, ci]
    runs-on: ubuntu-latest
    steps:
      # paczki bundlera z joba build (ci.yml): artefakty vizrs-cg-artist-<system>
      - uses: actions/download-artifact@v4
        with:
          path: raw
          pattern: 'vizrs-cg-artist-*'
      - name: Zebranie paczek
        env:
          V: ${{ needs.wersja.outputs.v }}
        run: |
          mkdir -p dist
          for n in linux-x86_64 windows-x86_64 macos-arm64; do
            d=raw/vizrs-cg-artist-$n; [ -d "$d" ] || { echo "::error::brak paczek $n z CI"; exit 1; }
            find "$d" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.dmg' \) -exec cp {} dist/ \;
            for f in "$d"/nsis/*.exe; do [ -f "$f" ] && cp "$f" "dist/VizRS-CG-Artist-$V-$n-setup.exe"; done
          done
          ls dist/*.AppImage dist/*.deb dist/*.msi dist/*-setup.exe dist/*.dmg >/dev/null || { echo "::error::niepełny zestaw paczek"; exit 1; }
          chmod +x dist/*.AppImage
          ls -la dist
      - name: Sumy kontrolne
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Usuń szkic tej wersji (publikacja ręczna)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.wersja.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .name == \"$TAG\") | .id" |
            xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/{}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.wersja.outputs.tag }}
          # znacznik tworzony przy publikacji wskazuje zbudowany commit, nie gałąź domyślną
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          prerelease: ${{ needs.wersja.outputs.pre == 'true' }}
          make_latest: ${{ needs.wersja.outputs.latest }}
          generate_release_notes: true
          files: dist/*
          body: |
            **Debian / Ubuntu 22.04+:** `sudo apt install ./*_amd64.deb`; Fedora: `.rpm`; inne dystrybucje: `.AppImage`.
            **Windows 10/11:** `.msi` albo instalator `-setup.exe` (WebView2 pobiera się sam, jeśli go brak).
            **macOS 11+ (Apple Silicon):** `.dmg`; program bez podpisu Apple – pierwsze uruchomienie: prawy klik → Otwórz. Trio i wyjście dla OBS: [VizRS CG System](https://github.com/sdorpl/VizRS-CG-System).
