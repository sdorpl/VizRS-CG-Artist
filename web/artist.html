<script type="module">
import * as PACK from '/cgpack.js';
import * as MO from '/motion.js';
import { PROPS, TYPES, FONTS, OFFLINE_FONTS, EASES, ScenePlayer, propAt, cornerRadii, layerZ, trackValue, walk, listFields, variantFields, uid, fitStage, parseColor, connectEvents } from '/renderer.js';
import { mountTickerEditor } from '/ticker-items.js';
import { nativeBridge, choose, confirmBox, promptBox } from '/native.js';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: body !== undefined ? { 'Content-Type': 'application/json' } : {}, body: body !== undefined ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
let toastT;
function toast(msg, err) {
  let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.toggle('err', !!err); el.style.opacity = 1;
  clearTimeout(toastT); toastT = setTimeout(() => (el.style.opacity = 0), 2600);
}

// ------------------------------------------------------------ stan
let scenes = [], scene = null, selId = null, selMore = [], t = 0, player = null, dirty = false;
let undo = [], redo = [], selKey = null, selKeys = [], clipKeys = null, pps = 320, assets = [], scale = 1, lastArea = 'canvas', pendingCP = false;
const LBL = 190;
const stage = $('#stage'), box = $('#box');

$('#fontlist').innerHTML = FONTS.map((f) => `<option>${f}</option>`).join('');
$('#addSel').innerHTML += Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v.icon} ${v.label}</option>`).join('');

function setDirty(d) { dirty = d; $('#bSave').classList.toggle('dirty', d); native.sync(); }
function checkpoint() {
  undo.push(JSON.stringify(scene)); if (undo.length > 150) undo.shift();
  redo = []; setDirty(true);
}
function restore(json) {
  // rev to znacznik zapisu na serwerze, nie treść: cofnięcie po zapisie nie może wrócić do starego (fałszywy konflikt)
  const rev = scene.rev;
  scene = JSON.parse(json);
  if (rev != null) scene.rev = rev; else delete scene.rev;
  if (selId && !locate(selId)) selId = null;
  selMore = selMore.filter((id) => id !== selId && locate(id));
  selKey = null; selKeys = [];
  player.setScene(scene); player.seek(t);
  if (dockPv && !scene.dock?.[dockPv.i]) { dockPv = null; $('#dockBar').hidden = true; player.setDock(0, 0, 0); buildRefs(); }
  renderAll(); setDirty(true); dockPlay(false);
}
function doUndo() { if (!undo.length) return; redo.push(JSON.stringify(scene)); restore(undo.pop()); }
function doRedo() { if (!redo.length) return; undo.push(JSON.stringify(scene)); restore(redo.pop()); }

function locate(id, nodes = scene.nodes, parent = null) {
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (n.id === id) return { node: n, list: nodes, index: i, parent };
    if (n.children) { const r = locate(id, n.children, n); if (r) return r; }
  }
  return null;
}
const selNode = () => (selId ? locate(selId)?.node : null);
/** Zablokowany węzeł (sam albo przez zablokowanego przodka) – nie da się go chwycić na kanwie ani przesunąć. */
function isLocked(id) { let cur = locate(id); while (cur) { if (cur.node.locked) return true; cur = cur.parent ? locate(cur.parent.id) : null; } return false; }
/** Położenie całej sceny (scene.x / scene.y): przesuwa wszystko naraz, bez zmiany kluczy animacji i props węzłów. */
function setSceneOffset(x, y) {
  x = Math.max(-16384, Math.min(16384, Math.round(x) || 0)); y = Math.max(-16384, Math.min(16384, Math.round(y) || 0));
  if (x) scene.x = x; else delete scene.x;
  if (y) scene.y = y; else delete scene.y;
  player.placeRoot();
  const ix = document.querySelector('[data-sp="x"]'), iy = document.querySelector('[data-sp="y"]');
  if (ix && document.activeElement !== ix) ix.value = x; if (iy && document.activeElement !== iy) iy.value = y;
  const pl = document.querySelector('#tree .item[data-id=""] .off'); if (pl) pl.textContent = x || y ? `${x}, ${y}` : '';
  queueGuides();
}
// ------------------------------------------------------------ geometria (układy grup)
// Dziecko grupy leży względem lewego górnego rogu ramki rodzica (renderer: left = x − przesunięcie punktu zaczepienia);
// obrót i skala rodzica działają wokół środka jego ramki (transform-origin 50% 50%).
const rnd = (v) => Math.round(v * 100) / 100;
const num = (n, p) => +propAt(n, p, t, null) || 0;
const scl = (n) => { const v = +propAt(n, 'scale', t, null); return Number.isFinite(v) ? v : 1; };
/** Przesunięcie lewego górnego rogu ramki względem punktu x / y (punkt zaczepienia). */
function anchorOff(n, w = num(n, 'w'), h = num(n, 'h')) {
  const ax = propAt(n, 'anchorX', t, null), ay = propAt(n, 'anchorY', t, null);
  return { x: ax === 'right' ? w : ax === 'center' ? w / 2 : 0, y: ay === 'bottom' ? h : ay === 'middle' ? h / 2 : 0 };
}
/** Ramka węzła (lewy górny róg, wymiar) w układzie rodzica, w bieżącym czasie. */
function boxIn(n) { const a = anchorOff(n); return { x: num(n, 'x') - a.x, y: num(n, 'y') - a.y, w: num(n, 'w'), h: num(n, 'h') }; }
/** Początek układu dzieci węzła id w układzie sceny (null = scena); bez obrotu i skali przodków. */
function originOf(id) {
  let x = 0, y = 0, cur = id ? locate(id) : null;
  while (cur) { const b = boxIn(cur.node); x += b.x; y += b.y; cur = cur.parent ? locate(cur.parent.id) : null; }
  return { x, y };
}
/** Obrót (°) i skala nadane węzłowi przez przodków – do przeliczenia ruchu myszy na układ rodzica. */
function parentXf(id) {

  while (cur) { rot += num(cur.node, 'rotation'); sc *= scl(cur.node); cur = cur.parent ? locate(cur.parent.id) : null; }
  return { rot, sc: sc || 1 };
}
/** Wektor (dx, dy) ze sceny do układu o obrocie rot i skali sc. */
function toLocal(dx, dy, xf) {

  return [(dx * c - dy * s) / xf.sc, (dx * s + dy * c) / xf.sc];
}
/** Przesuwa węzeł o (dx, dy) razem z kluczami animacji x / y – w każdej chwili wygląda tak samo, tylko przesunięty. */
function shiftNode(n, dx, dy) {
  for (const [p, d] of [['x', dx], ['y', dy]]) {
    if (!d) continue;
    n.props ||= {}; n.props[p] = rnd((+n.props[p] || 0) + d);

/** Zaznaczenie: główny węzeł (panel właściwości) + dodatkowe (Ctrl / Shift+klik). */
const selAll = () => (selId ? [selId, ...selMore.filter((id) => id !== selId)] : []);

}
const plElem = (k) => (k === 1 ? 'element' : k % 10 >= 2 && k % 10 <= 4 && (k % 100 < 12 || k % 100 > 14) ? 'elementy' : 'elementów');
/** Zaznaczone bez tych, których przodek też jest zaznaczony (przesuwa się i tak razem z nim). */
function topSel() {
  const ids = selAll().filter((id) => locate(id));
  return ids.filter((id) => { let cur = locate(id); while (cur?.parent) { if (ids.includes(cur.parent.id)) return false; cur = locate(cur.parent.id); } return true; });
}
/** Wymiar grupy = obrys zawartości (z obrotem i skalą dzieci, także na ujemnych współrzędnych), jak w Viz Artist.
 *  Początek grupy przesuwa się na lewy górny róg zawartości, dzieci o tyle samo w przeciwną stronę – na ekranie nic się nie rusza. */
function fitGroup(g) {
  if (!g || g.type !== 'group' || !g.children?.length) return false;
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const c of g.children) {
    const b = boxIn(c), cx = b.x + b.w / 2, cy = b.y + b.h / 2, sc = scl(c), a = num(c, 'rotation') * Math.PI / 180;
    for (const [px, py] of [[-b.w / 2, -b.h / 2], [b.w / 2, -b.h / 2], [b.w / 2, b.h / 2], [-b.w / 2, b.h / 2]]) {
      const X = cx + sc * (px * Math.cos(a) - py * Math.sin(a)), Y = cy + sc * (px * Math.sin(a) + py * Math.cos(a));
      x1 = Math.min(x1, X); y1 = Math.min(y1, Y); x2 = Math.max(x2, X); y2 = Math.max(y2, Y);
    }
  }
  const w = Math.round(x2 - x1), h = Math.round(y2 - y1);
  if (!(w > 0 && h > 0)) return false;
  const mx = Math.round(x1), my = Math.round(y1);
  // nowy lewy górny róg L'' = L + M·m + (I − M)(c − c'), M = obrót·skala grupy (wokół środka ramki)
  const old = boxIn(g), sc = scl(g), a = num(g, 'rotation') * Math.PI / 180;
  const M = (x, y) => [sc * (x * Math.cos(a) - y * Math.sin(a)), sc * (x * Math.sin(a) + y * Math.cos(a))];
  const [mmx, mmy] = M(mx, my), dcx = old.w / 2 - w / 2, dcy = old.h / 2 - h / 2, [Mdx, Mdy] = M(dcx, dcy);
  const Lx = old.x + mmx + dcx - Mdx, Ly = old.y + mmy + dcy - Mdy;
  for (const c of g.children) shiftNode(c, -mx, -my);
  const aOld = anchorOff(g), aNew = anchorOff(g, w, h);
  shiftNode(g, rnd(Lx + aNew.x - (old.x + aOld.x)), rnd(Ly + aNew.y - (old.y + aOld.y)));
  g.props ||= {}; g.props.w = w; g.props.h = h;
  if (g.anim?.w?.length || g.anim?.h?.length) toast('Grupa ma animowany wymiar – dopasowano wartość podstawową', true);
  return true;
}

/**
 * Font wpisany ręcznie → nazwa, którą zna renderer: czcionka z zasobów jest rodziną o nazwie pliku, więc „MojaCzcionka”,
 * „mojaczcionka.TTF” albo „Moja Czcionka.ttf” (nazwa sprzed poprawienia przez serwer) wskazują plik `MojaCzcionka.ttf`
 * zamiast szukać kroju w Google Fonts. Wbudowane rodziny dostają kanoniczną pisownię.
 */
function resolveFont(v) {
  const name = String(v || '').trim(); if (!name) return name;
  const files = assetFonts(), all = [...new Set([...FONTS, ...OFFLINE_FONTS])];
  if (files.includes(name) || all.includes(name)) return name;
  const lc = name.toLowerCase(), safe = (PACK.safeAssetName(name) || '').toLowerCase();
  const stem = (f) => f.replace(PACK.FONT_RE, '').toLowerCase();
  return files.find((f) => f.toLowerCase() === lc || f.toLowerCase() === safe)
    || all.find((f) => f.toLowerCase() === lc)
    || files.find((f) => stem(f) === lc || stem(f) === safe.replace(PACK.FONT_RE, ''))

async function confirmLeave() {
  if (!dirty) return true;
  const c = await choose(`Scena „${scene.name}” ma niezapisane zmiany.`, { title: 'Zapisać zmiany przed przejściem?', buttons: ['Zapisz', 'Nie zapisuj', 'Anuluj'] });

// ostrzeżenie: zapis szablonu, który właśnie jest na antenie (brak odpowiedzi serwera nie blokuje zapisu)
async function confirmOnAir() {
  const st = await api('GET', '/api/state').catch(() => null);
  const air = st?.layers?.filter((l) => l.page?.scene === scene.id).map((l) => l.layer) || [];
  return !air.length || confirmBox(`Scena „${scene.name}” jest teraz na antenie (warstwa: ${air.join(', ')}).`, { title: 'Zapisać zmiany szablonu na antenie?', ok: 'Zapisz' });
}
async function save(force) {
  try {
    if (force !== true && !(await confirmOnAir())) return false;
    const body = force === true ? (({ rev, ...r }) => r)(scene) : scene; // bez rev = świadome nadpisanie
    const saved = await api('PUT', '/api/scenes/' + encodeURIComponent(scene.id), body);
    scene.rev = saved.rev;
    const i = scenes.findIndex((s) => s.id === saved.id);
    if (i >= 0) scenes[i] = saved; else scenes.push(saved);
    setDirty(false); renderSceneSel(); toast('Zapisano scenę „' + scene.name + '”');
    native.clearDraft(); native.sync();
    return true;
  } catch (e) {
    if (/^konflikt/.test(e.message)) {
      if (await confirmBox('Ta scena została zmieniona przez kogoś innego (lub w innym oknie).', { title: 'Nadpisać scenę swoją wersją?', ok: 'Nadpisz', cancel: 'Nie zapisuj' })) return save(true);
      toast('Konflikt zapisu – scena nie zapisana', true);
    } else toast('Błąd zapisu: ' + e.message, true);
    return false;
  }
}
async function newScene(name, base) {
  const s = base || { name, layer: 'main', width: 1920, height: 1080, duration: 1, stops: [], nodes: [] };
  s.id = '';
  try {
    const saved = await api('POST', '/api/scenes', s);
    scenes.push(saved); renderSceneSel(); openScene(saved);
  } catch (e) { toast(e.message, true); }
}

const btns = (p, d) => `${d.anim ? `<button class="icon kbtn" data-key="${p}" title="Klucz animacji w bieżącym czasie (dodaj/usuń)">◆</button>` : ''}<button class="icon fbtn" data-field="${p}" title="Pole kontrolne (Control Object) – edytowalne w Trio"><i class="ico link"></i></button>`;
const scrubLbl = (p, d, txt) => `<label data-scrub="${d.t === 'num' ? p : ''}" title="${esc(d.label || p)} (${p})${d.t === 'num' ? ' – przeciągnij, aby zmienić' : ''} · prawy klik = wartość domyślna">${esc(txt)}</label>`;

function renderProps() {
  const el = $('#props');
  const n = selNode();
  $('#ptools').hidden = !n;
  if (!n) { $('#propsTitle').textContent = 'Scena'; renderSceneProps(); return; }
  const def = TYPES[n.type];
  const msel = multiSel() ? selAll().map((id) => locate(id)?.node).filter(Boolean) : [];
  $('#propsTitle').textContent = msel.length > 1 ? `Właściwości – ${msel.length} ${plElem(msel.length)}` : 'Właściwości – ' + def.label;
  for (const b of $$('[data-ptab]')) b.classList.toggle('on', b.dataset.ptab === pui.tab);
  $('#pall').classList.toggle('on', pui.all);
  $('#pall').textContent = pui.all ? 'Wszystko' : 'Podstawowe';
  const ruchOn = !!n.motion || Object.values(n.anim || {}).some((a) => a?.length);
  const daneOn = !!n.showIf || Object.keys(n.fields || {}).length > 0;
  $('[data-ptab="ruch"]').classList.toggle('dot', ruchOn);
  $('[data-ptab="dane"]').classList.toggle('dot', daneOn);

  const val = (k) => propAt(n, k, t, null);
  const tkMode = n.type === 'ticker' ? val('tickerMode') : null;
  const TK_HIDE = { crawl: ['hold'], roll: ['speed', 'crawlFrom', 'sep', 'sepStyle', 'sepColor'], wipe: ['speed', 'crawlFrom', 'sep', 'sepStyle', 'sepColor'], whip: ['speed', 'crawlFrom', 'sep', 'sepStyle', 'sepColor'] };
  // kilka zaznaczonych: tylko właściwości wspólne dla ich typów
  const own = new Set(def.props.filter((p) => msel.every((m) => TYPES[m.type]?.props.includes(p))));
  const shown = (p) => {
    if (!own.has(p) || (tkMode && TK_HIDE[tkMode]?.includes(p))) return false;
    const s = propState(n, p);
    if (s.used) return true;
    if (WHEN[p] && !WHEN[p](val)) return false;
    return pui.all || !ADV.has(p);
  };
  const inert = (p) => WHEN[p] && !WHEN[p](val);
  const comboOf = new Map(); for (const c of COMBOS) for (const p of c.props) comboOf.set(p, c);

  let wl = msel.length > 1
    ? `<div class="phead"><span class="ic">⧉</span><span class="grow" title="Zmiana właściwości dotyczy wszystkich zaznaczonych, które ją mają; „—” – różne wartości">${esc(Object.entries(msel.reduce((o, m) => { const l = TYPES[m.type]?.label || m.type; o[l] = (o[l] || 0) + 1; return o; }, {})).map(([l, k]) => `${k} × ${l}`).join(', '))}</span></div>`
    : `<div class="phead"><span class="ic">${def.icon}</span><input id="pname" class="grow" value="${esc(n.name)}" title="Nazwa kontenera"></div>`;
  const groups = []; // [nazwa, html]
  const add = (g, html) => { let e = groups.find((x) => x[0] === g); if (!e) groups.push(e = [g, '']); e[1] += html; };
  const done = new Set();
  let hidden = 0;
  for (const p of def.props) {
    if (done.has(p)) continue;
    const d = PROPS[p];
    if (tkMode && p === 'text') {
      done.add(p);
      add(d.g, `<div class="prtk" data-prop="text"><div class="prtk-h"><span class="grow">wiadomości próbne <span class="dim">(w Trio: pole strony)</span></span><button class="icon fbtn" data-field="text" title="Pole kontrolne (Control Object) – edytowalne w Trio"><i class="ico link"></i></button></div><div data-tkhost></div><textarea data-p="text" hidden></textarea></div>`);
      continue;
    }
    const c = comboOf.get(p);
    const members = c ? c.props.filter((x) => own.has(x) && !done.has(x)) : [p];
    for (const x of members) done.add(x);
    // zaokrąglenie: jeden schemat dla wszystkich rogów i boków (rozwinięcie – przycisk w wierszu, nie tryb „Wszystko”)
    const vis = c?.kind === 'radius' ? (members.some(shown) || members.some((x) => propState(n, x).used) ? members : []) : members.filter(shown);
    hidden += members.length - vis.length;
    if (!vis.length) continue;
    if (!c || vis.length === 1) { for (const x of vis) add(PROPS[x].g, rowOne(x)); }
    else add(d.g, rowCombo(c, vis));
    if (p === 'textFit' || (vis.includes('textFit'))) add(d.g, `<div class="sqinfo" id="sqInfo"></div>`);
  }
  if (scenes.length > 1) add('Względem innej sceny', relForm(true));
  for (const [g, body] of groups) {
    wl += `<div class="pgsec ${folded(g) ? 'fold' : ''}" data-sec="${esc(g)}"><button class="pgroup" data-fold="${esc(g)}"><span class="car">▾</span> ${esc(g)}<span class="cnt"></span></button><div class="pgbody">${body}</div></div>`;
  }
  if (hidden && !pui.all) wl += `<div class="pmore"><button data-pall>＋ ${hidden} rzadziej używanych – pokaż wszystkie</button></div>`;
  wl += `<div class="pnone dim" hidden>Brak właściwości pasujących do szukanej frazy.</div>`;

  function rowOne(p) {
    const d = PROPS[p];
    if (comboOf.get(p)?.kind === 'seg' || comboOf.get(p)?.kind === 'anchor') return rowCombo(comboOf.get(p), [p]);
    return `<div class="pr ${inert(p) ? 'inert' : ''}" data-prop="${p}" data-q="${esc(p + ' ' + (d.label || ''))}" ${inert(p) ? 'title="Nie działa przy obecnych ustawieniach węzła"' : ''}>
      ${scrubLbl(p, d, d.label || p)}<div class="pin">${inputFor(p, d)}</div>${d.anim ? `<button class="icon kbtn" data-key="${p}" title="Klucz animacji w bieżącym czasie (dodaj/usuń)">◆</button>` : '<span></span>'}
      <button class="icon fbtn" data-field="${p}" title="Pole kontrolne (Control Object) – edytowalne w Trio"><i class="ico link"></i></button></div>`;
  }
  function rowCombo(c, vis) {
    const q = esc(vis.map((x) => x + ' ' + (PROPS[x].label || '')).join(' ') + ' ' + (c.label || ''));
    if (c.kind === 'anchor') {
      const cells = [];
      for (const yv of ['top', 'middle', 'bottom']) for (const xv of ['left', 'center', 'right']) cells.push(`<button class="icon" data-anchor="${xv},${yv}" title="punkt: ${xv} / ${yv}"></button>`);
      return `<div class="pr pcombo" data-q="${q}"><label title="Punkt zaczepienia (anchorX / anchorY): right/bottom = element rośnie w lewo/w górę">${esc(c.label)}</label>
        <div class="pin anchor-row"><div class="agrid">${cells.join('')}</div><span class="dim mono" data-anchorlbl></span>
        ${vis.map((x) => `<span class="cell" data-prop="${x}"><select data-p="${x}" hidden>${PROPS[x].opts.map((o) => `<option>${o}</option>`).join('')}</select>${btns(x, PROPS[x])}</span>`).join('')}</div><span></span><span></span></div>`;
    }
    if (c.kind === 'seg') {
      return `<div class="pr pcombo" data-q="${q}"><label>${esc(c.label)}</label><div class="pin seg-row">${vis.map((x) => `<span class="cell" data-prop="${x}"><span class="segb">${SEG[x].map(([v, ic]) => `<button class="icon" data-seg="${x}" data-v="${v}" title="${SEG_T[v]}">${ic}</button>`).join('')}</span><select data-p="${x}" hidden>${PROPS[x].opts.map((o) => `<option>${o}</option>`).join('')}</select>${btns(x, PROPS[x])}</span>`).join('')}</div><span></span><span></span></div>`;
    }
    if (c.kind === 'bools') {
      return `<div class="pr pcombo" data-q="${q}"><label>${esc(c.label)}</label><div class="pin seg-row">${vis.map((x) => `<span class="cell" data-prop="${x}"><label class="chk"><input type="checkbox" data-p="${x}"> ${esc(PROPS[x].label)}</label>${btns(x, PROPS[x])}</span>`).join('')}</div><span></span><span></span></div>`;
    }
    if (c.kind === 'radius') return radiusRow(c, vis);
    const cols = c.kind === 'wide1' && vis.length === 2 ? '2fr 1fr' : `repeat(${vis.length}, minmax(0, 1fr))`;
    const lockBtn = c.ratio && vis.length === 2 ? `<button class="icon ratio ${pui.ratio ? 'on' : ''}" data-ratio title="Zachowaj proporcje szerokości i wysokości">⛓</button>` : '';
    return `<div class="pmulti" data-q="${q}">${c.label ? `<div class="pmlbl">${esc(c.label)}</div>` : ''}<div class="pmgrid" style="grid-template-columns:${cols}${lockBtn ? ' 22px' : ''}">
      ${vis.map((x) => { const d = PROPS[x], i = c.props.indexOf(x); return `<div class="cell ${inert(x) ? 'inert' : ''}" data-prop="${x}"><div class="ch">${scrubLbl(x, d, c.short?.[i] || d.label || x)}<span class="grow"></span>${btns(x, d)}</div>${inputFor(x, d)}</div>`; }).join('')}${lockBtn}</div></div>`;
  }

  /** Zaokrąglenie: „wszystkie rogi” + schemat prostokąta z polami w rogach i na bokach (puste pole = dziedziczy). */
  function radiusRow(c, vis) {
    const q = esc(vis.map((x) => x + ' ' + (PROPS[x].label || '')).join(' ') + ' zaokrąglenie rogi boki narożniki');
    const own8 = vis.filter((x) => x !== 'radius');
    const used8 = own8.some((x) => propState(n, x).used);
    const open = own8.length && (used8 || pui.radius);
    const cell = (x) => {
      if (!vis.includes(x)) return '<span></span>';
      const d = PROPS[x], R = RAD_UI[x];
      return `<div class="cell rcell r-${R.pos}" data-prop="${x}"><div class="ch">${scrubLbl(x, d, R.short)}<span class="grow"></span>${btns(x, d)}</div><input type="number" data-p="${x}" step="1" min="-1" title="${esc(R.tip)} – puste = ${R.side ? 'jak „wszystkie”' : 'z boków albo jak „wszystkie”'}"></div>`;
    };
    const all = vis.includes('radius') ? `<div class="cell rall" data-prop="radius"><div class="ch">${scrubLbl('radius', PROPS.radius, 'wszystkie rogi')}<span class="grow"></span>${btns('radius', PROPS.radius)}</div><input type="number" data-p="radius" step="1" min="0"></div>` : '';
    const tog = own8.length ? `<button class="rtog ${open ? 'on' : ''}" data-radx title="${open ? 'Zwiń' : 'Pokaż'} osobne zaokrąglenie każdego rogu i boku">${open ? '▾' : '▸'} osobno${used8 ? ' •' : ''}</button>` : '';
    let h = `<div class="pmulti prad" data-q="${q}"><div class="pmlbl">${esc(c.label)}</div><div class="rtop">${all}${tog}</div>`;
    if (open) {
      h += `<div class="rgrid">${cell('radiusTL')}${cell('radiusT')}${cell('radiusTR')}${cell('radiusL')}<div class="rprev" title="Podgląd rogów (w skali krótszego boku elementu)"><i data-rprev></i></div>${cell('radiusR')}${cell('radiusBL')}${cell('radiusB')}${cell('radiusBR')}</div>
        <div class="rhint">Puste pole dziedziczy: róg → z boków → „wszystkie”. Dwa boki przy rogu (np. górny i lewy) dają róg eliptyczny.${used8 ? ' <button class="linkb" data-radclr title="Usuń zaokrąglenia rogów i boków – wszystkie rogi jak „wszystkie”">wyczyść rogi i boki</button>' : ''}</div>`;
    }
    return h + '</div>';
  }

  let ruch = motionForm(n);
  ruch += `<div class="pgroup">Presety animacji (klucze)</div>
  <div class="pr" style="grid-template-columns:1fr auto auto"><select id="apSel"><option value="">— wybierz —</option>${animPresets.map((x) => `<option value="${esc(x.id)}">${esc(x.name)} (${x.duration}s)</option>`).join('')}</select><button data-ap="apply" title="Wstaw klucze presetu od bieżącego czasu">Zastosuj</button><button data-ap="save" title="Zapisz klucze tego węzła jako preset">＋ zapisz</button></div>
  <div class="pr" style="grid-template-columns:1fr auto auto auto"><span class="dim" style="font-size:11px">preset = zestaw kluczy (czasy względne)</span><button data-ap="export" title="Pobierz preset do pliku">⇩</button><button data-ap="import" title="Wczytaj preset z pliku">⇧</button><button data-ap="del" class="icon danger" title="Usuń preset"><i class="ico del"></i></button></div>`;
  const keyed = Object.keys(n.anim || {}).filter((p) => n.anim[p]?.length);
  ruch += `<div class="pgroup">Klucze węzła</div>` + (keyed.length
    ? `<div class="chips plist">${keyed.map((p) => `<span class="pill" title="${n.anim[p].length} kluczy">◆ ${esc(PROPS[p]?.label || p)} · ${n.anim[p].length}</span>`).join('')}</div>`
    : `<div class="dim pnote">Brak kluczy. ◆ przy właściwości dodaje klucz w bieżącym czasie; gdy właściwość ma już klucze, zmiana wartości tworzy/aktualizuje klucz.</div>`);

  const vf = variantFields(scene);
  let dane = `<div class="pgroup">Wariant – widoczność</div>`;
  if (vf.length) {
    const si = n.showIf || {};
    dane += `<div class="pr" style="grid-template-columns:100px 1fr 1fr"><label>widoczny gdy</label>
      <select data-si="field"><option value="">— zawsze —</option>${vf.map((f) => `<option value="${esc(f.id)}" ${si.field === f.id ? 'selected' : ''}>${esc(f.label)}</option>`).join('')}</select>
      <input data-si="value" list="si_vals" value="${esc(si.value || '')}" placeholder="wartość (a,b)" ${si.field ? '' : 'disabled'}>
      <datalist id="si_vals">${(vf.find((f) => f.id === si.field)?.opts || []).map((o) => `<option>${esc(o)}</option>`).join('')}</datalist></div>`;
  } else dane += `<div class="dim pnote">Zdefiniuj warianty w ustawieniach sceny (kliknij puste tło), aby pokazywać ten węzeł tylko w wybranym wariancie.</div>`;
  const fl = Object.entries(n.fields || {});
  dane += `<div class="pgroup">Pola kontrolne węzła</div>` + (fl.length
    ? fl.map(([p, f]) => `<div class="pr" style="grid-template-columns:1fr 1fr 24px"><span>${esc(PROPS[p]?.label || p)}</span><span class="pill fld">${esc(f)}</span><button class="icon fbtn on" data-field="${p}" title="Zmień lub usuń pole kontrolne"><i class="ico link"></i></button></div>`).join('')
    : `<div class="dim pnote"><i class="ico link"></i> przy właściwości wystawia ją jako pole kontrolne: operator Trio wpisze tu wartość na stronie. <b>[[tekst]]</b> w tekście = wyróżnienie.</div>`);

  if (msel.length > 1) ruch = dane = `<div class="dim pnote">Ruch, warianty i pola kontrolne ustawia się dla jednego elementu – zaznacz jeden (klik na kanwie albo w drzewie).</div>`;
  el.innerHTML = `<div class="ptab" data-tab="wl" ${pui.tab === 'wl' ? '' : 'hidden'}>${wl}</div><div class="ptab" data-tab="ruch" ${pui.tab === 'ruch' ? '' : 'hidden'}>${ruch}</div><div class="ptab" data-tab="dane" ${pui.tab === 'dane' ? '' : 'hidden'}>${dane}</div>`;
  syncProps(true);
  applySearch();
  showSqueeze();
  const host = $('[data-tkhost]', el);
  if (host) {
    const ta = $('textarea[data-p="text"]', el);
    mountTickerEditor(host, {
      value: ta.value, catColors: val('catColors'), catBg: val('catBg'), catFg: val('catFg'), label: val('label'), rules: scene.fieldMeta?.[n.fields?.text] || {},
      onChange: (v) => { ta.value = v; ta.dispatchEvent(new Event('input', { bubbles: true })); },
      onHover: (i) => player.tickerPin(n.id, i),
    });
  }
}
/** Szukanie właściwości: filtruje wiersze zakładki Właściwości i rozwija pasujące grupy. */
function applySearch() {
  const q = ($('#psearch')?.value || '').trim().toLowerCase();
  const tab = $('#props .ptab[data-tab="wl"]'); if (!tab) return;
  tab.classList.toggle('searching', !!q);
  let any = false;
  for (const sec of $$('.pgsec', tab)) {
    let n = 0;
    for (const r of $$('[data-q]', sec)) { const m = !q || r.dataset.q.toLowerCase().includes(q) || sec.dataset.sec.toLowerCase().includes(q); r.hidden = !m; if (m) n++; }
    for (const r of $$('.sqinfo, .prtk', sec)) if (q) r.hidden = !sec.dataset.sec.toLowerCase().includes(q) && !(r.classList.contains('prtk') && 'tekst text'.includes(q)); else r.hidden = false;
    sec.hidden = q && !n; any ||= n > 0;
  }
  $('.pnone', tab).hidden = !q || any;
  const more = $('.pmore', tab); if (more) more.hidden = !!q;
  if (q && pui.tab !== 'wl') { pui.tab = 'wl'; savePui(); renderProps(); }
}
/** Stany wierszy: zmieniona / animowana / pole kontrolne + liczniki na nagłówkach grup. */
function markProps(n) {
  for (const r of $$('#props [data-prop]')) {
    const p = r.dataset.prop; if (!PROPS[p]) continue;
    const s = propState(n, p);
    r.classList.toggle('mod', s.mod); r.classList.toggle('anim', s.anim); r.classList.toggle('fld', !!s.fld);
  }
  for (const sec of $$('#props .pgsec')) {
    const c = (k) => $$(`[data-prop].${k}`, sec).length;
    const m = c('mod'), a = c('anim'), f = c('fld');
    $('.cnt', sec).textContent = [m && `${m} zm.`, a && `◆${a}`, f && `⛓${f}`].filter(Boolean).join(' · ');
  }
  const ax = propAt(n, 'anchorX', t, null), ay = propAt(n, 'anchorY', t, null);
  for (const b of $$('#props [data-anchor]')) b.classList.toggle('on', b.dataset.anchor === `${ax},${ay}`);
  const al = $('#props [data-anchorlbl]'); if (al) al.textContent = `${ax} / ${ay}`;
  for (const b of $$('#props [data-seg]')) b.classList.toggle('on', propAt(n, b.dataset.seg, t, null) === b.dataset.v);
}

/** Ruch (node.motion): presety IN/OUT, efekt tekstu, pętla uwagi – bez kluczy, liczone przez renderer. */
function motionForm(n) {
  const m = n.motion || {};
  const opt = (list, v, lab) => list.map((x) => `<option value="${x}" ${x === (v || 'none') ? 'selected' : ''}>${esc(lab ? lab(x) : x)}</option>`).join('');
  const numIn = (k, v, ph, step = 0.05) => `<input type="number" min="0" step="${step}" data-mo="${k}" value="${v ?? ''}" placeholder="${ph}">`;
  const phase = (k, label) => {
    const s = m[k] || {}, on = s.type && s.type !== '';
    let r = `<div class="mo"><label>${label}</label><select data-mo="${k}.type" style="grid-column:2/4"><option value="" ${on ? '' : 'selected'}>— bez presetu —</option>${opt(MO.ANIM_TYPES, on ? s.type : '-', (x) => MO.ANIM_LABELS[x] || x)}</select>`;
    if (on) {
      r += `<div class="sub"><label>czas s${numIn(k + '.dur', s.dur, '0.5')}</label><label>opóźnienie s${numIn(k + '.delay', s.delay, '0')}</label>
        <label>kierunek<select data-mo="${k}.dir" ${MO.DIR_TYPES.has(s.type) ? '' : 'disabled'}>${opt(MO.DIRECTIONS, s.dir || 'left', (x) => MO.DIR_LABELS[x])}</select></label></div>
        <div class="sub"><label style="grid-column:1/4">krzywa<select data-mo="${k}.ease">${opt(MO.MOTION_EASES, s.ease || 'power2.out')}</select></label></div>`;
    }
    return r + '</div>';
  };
  const textPhase = (k, label, list) => {
    const s = m[k] || {}, on = s.type && s.type !== 'none';
    let r = `<div class="mo"><label>${label}</label><select data-mo="${k}.type" style="grid-column:2/4">${opt(list, s.type || 'none', MO.textLabel)}</select>`;
    if (on) {
      r += `<div class="sub"><label>czas s${numIn(k + '.dur', s.dur, '0.5')}</label><label>opóźnienie s${numIn(k + '.delay', s.delay, '0')}</label>
        <label>odstęp s${numIn(k + '.stagger', s.stagger, 'auto', 0.01)}</label></div>
        <div class="sub"><label style="grid-column:1/4">kolejność<select data-mo="${k}.from">${opt(MO.STAGGER_FROM, s.from || 'start', (x) => ({ start: 'od początku', end: 'od końca', center: 'od środka', edges: 'od krawędzi' })[x])}</select></label></div>`;
    }
    return r + '</div>';
  };
  const lp = m.loop || {}, lpOn = lp.type && lp.type !== 'none';
  let h = `<div class="pgroup">Ruch – bez kluczy</div>` + phase('in', 'wejście') + phase('out', 'wyjście');
  if (n.type === 'text' || n.type === 'clock') h += textPhase('textIn', 'tekst IN', MO.TEXT_IN) + textPhase('textOut', 'tekst OUT', MO.TEXT_OUT);
  h += `<div class="mo"><label>pętla</label><select data-mo="loop.type" style="grid-column:2/4">${opt(MO.LOOP_TYPES, lp.type || 'none', (x) => MO.LOOP_LABELS[x])}</select>`;
  if (lpOn) h += `<div class="sub"><label>okres s${numIn('loop.dur', lp.dur, 'auto')}</label><label>siła${numIn('loop.amp', lp.amp, 'auto', 0.5)}</label>
    <label>kolor<input data-mo="loop.color" value="${esc(lp.color || '')}" placeholder="auto" ${['glow', 'shine', 'underline-sweep'].includes(lp.type) ? '' : 'disabled'}></label></div>`;
  h += '</div>';
  if (n.type === 'rect' || n.type === 'ellipse') h += `<div class="mo"><label title="Stały efekt tła – gra cały czas, także w trakcie wejścia">efekt tła</label><select data-mobg style="grid-column:2/4">${opt(MO.BG_TYPES, m.bg || 'none', (x) => MO.BG_LABELS[x])}</select></div>`;
  const ORG = { '': 'środek', '0,0': 'lewy górny róg', '0.5,0': 'góra', '1,0': 'prawy górny róg', '0,0.5': 'lewa krawędź', '1,0.5': 'prawa krawędź', '0,1': 'lewy dolny róg', '0.5,1': 'dół', '1,1': 'prawy dolny róg' };
  const org = Array.isArray(m.origin) ? m.origin.join(',') : '';
  h += `<div class="mo"><label title="Punkt odniesienia skali i obrotu ruchu (presety przesłon, obrotu i odwróceń mają własny)">punkt ruchu</label><select data-moorg style="grid-column:2/4">${Object.entries(ORG).map(([k, v]) => `<option value="${k}" ${k === org ? 'selected' : ''}>${v}</option>`).join('')}${org && !ORG[org] ? `<option value="${org}" selected>${org}</option>` : ''}</select></div>`;
  const others = []; walk(scene.nodes, (x) => { if (x.id !== n.id) others.push(x); });
  h += `<div class="mo"><label title="Sekwencja: wejście zaczyna się, gdy skończy się wejście wskazanego węzła">po węźle</label><select data-moafter style="grid-column:2/4"><option value="">— od początku sceny —</option>${others.map((x) => `<option value="${esc(x.id)}" ${m.after === x.id ? 'selected' : ''}>${esc(x.name || x.id)}</option>`).join('')}</select></div>`;
  const hasOut = m.out?.type || (m.textOut?.type && m.textOut.type !== 'none');
  const st = sortedStops();
  if ((m.in?.type || hasOut || lpOn || (m.textIn?.type && m.textIn.type !== 'none')) && (!st.length || (hasOut && scene.duration < st[st.length - 1] + MO.outLen(m, n.props?.text) - 1e-3))) {
    h += `<div class="mohint">${!st.length ? 'Brak stop pointu: wyjście (OUT) zagra od ostatniego stopu, a pętla gra, gdy grafika stoi.' : 'Wyjście nie mieści się w długości sceny.'} <button data-mofit title="Stop point po wejściu i długość sceny = stop + wyjście">⟲ Dopasuj stop i długość</button></div>`;
  }
  return h;
}
/** Stop point po najdłuższym wejściu i długość sceny = stop + najdłuższe wyjście (ruch presetów i klucze). */
function fitMotionTiming() {
  const sh = MO.sequenceShifts(scene.nodes);
  let inE = 0, outL = 0, keyEnd = 0;
  walk(scene.nodes, (x) => {
    if (x.motion) { const tx = x.props?.text; inE = Math.max(inE, MO.inEnd(x.motion, sh.get(x.id) || 0, tx)); outL = Math.max(outL, MO.outLen(x.motion, tx)); }
    for (const tr of Object.values(x.anim || {})) for (const k of tr) keyEnd = Math.max(keyEnd, k.t);
  });
  checkpoint();
  const st = sortedStops();
  if (!st.length) scene.stops = [Math.round(Math.max(inE, 0.04) * 100) / 100];
  else if (st[st.length - 1] < inE) scene.stops = [...st.slice(0, -1), Math.round(inE * 100) / 100];
  const last = Math.max(...scene.stops);
  scene.duration = Math.round(Math.max(last + outL, last + 0.04, outL > 0 ? 0 : keyEnd) * 100) / 100;
  $('#dur').value = scene.duration;
  renderProps(); renderTimeline(); refresh();
}

const hex6 = (c) => { const p = parseColor(c); if (!p) return '#000000'; return '#' + p.slice(0, 3).map((x) => Math.round(x).toString(16).padStart(2, '0')).join(''); };

function syncProps(force) {

/** Kilka zaznaczonych: pole z różnymi wartościami jest puste z „—”, przełącznik – nieokreślony; ◆ i pola kontrolne – tylko dla jednego. */
function syncMulti(n, force) {

/** Schemat zaokrąglenia: puste pola pokazują wartość dziedziczoną, podgląd ma kształt i proporcje elementu. */
function syncRadius(n) {
  const pv = $('#props [data-rprev]'); if (!pv) return;
  const p = (k) => propAt(n, k, t, null), r = Math.max(0, +p('radius') || 0);
  const eff = cornerRadii(p) || [[r, r], [r, r], [r, r], [r, r]];

  const r1 = (v) => String(Math.round(v * 10) / 10);
  for (const inp of $$('#props .rgrid input[data-p]')) {
    const k = inp.dataset.p, i = idx[k];
    inp.placeholder = i != null ? r1(Math.max(...eff[i])) : r1(+p(k) >= 0 ? +p(k) : r);
  }

}

  const sh = MO.sequenceShifts(scene.nodes), oS = outStartOf();

/** Elementy, których dotyczą narzędzia sekwencji: dzieci zaznaczonej grupy, rodzeństwo zaznaczonego elementu albo scena. */
function seqTargets() {
  const n = selNode();
  if (n?.children?.length) return n.children;

const r2 = (v) => Math.round(v * 100) / 100;
async function seqTool(act) {
  const n = selNode();
  if (act === 'fit') return fitMotionTiming();
  if (act === 'stagger') {
    const step = Math.max(0, parseFloat($('#seqStep').value) || 0);
    let list = seqTargets();
    if (!list.length) return;
    checkpoint();
    const withIn = list.filter((x) => x.motion?.in?.type);
    if (!withIn.length) for (const x of list) (x.motion ||= {}).in = { type: 'fade', dur: 0.4, ease: 'power2.out' };
    list = list.filter((x) => x.motion?.in?.type);
    const base = MO.specDelay(list[0].motion.in);
    list.forEach((x, i) => { delete x.motion.after; x.motion.in.delay = r2(base + i * step); if (!x.motion.in.delay) delete x.motion.in.delay; });

    outs.forEach((x, i) => { const d = r2((outs.length - 1 - i) * step); if (d) x.motion.out.delay = d; else delete x.motion.out.delay; });
    toast(`Kaskada: ${list.length} elementów co ${step} s${outs.length ? ' (wyjścia odwrotnie)' : ''}`);
  } else if (act === 'chain') {
    const list = seqTargets().filter((x) => x.motion?.in?.type || x.motion?.textIn?.type);
    if (list.length < 2) return toast('Po kolei: potrzeba co najmniej dwóch elementów z ruchem wejścia', true);
    checkpoint();
    list.forEach((x, i) => { if (i) x.motion.after = list[i - 1].id; else delete x.motion.after; });
    toast(`Po kolei: ${list.length} elementów`);
  } else if (act === 'copy') {
    if (!n?.motion) return toast('Zaznacz element z ruchem do skopiowania', true);
    const list = locate(n.id).list.filter((x) => x !== n);
    if (!list.length || !(await confirmBox(`Ruch „${n.name}” zastąpi ruch ${list.length} element(ów) obok.`, { title: 'Skopiować ruch?', ok: 'Kopiuj' }))) return;
    checkpoint();
    for (const x of list) {
      const m = structuredClone(n.motion); delete m.after;
      if (x.type !== 'text' && x.type !== 'clock') { delete m.textIn; delete m.textOut; }
      if (Object.keys(m).length) x.motion = m; else delete x.motion;
    }
    toast(`Skopiowano ruch na ${list.length} element(y)`);
  } else if (act === 'keys') {
    if (!n?.motion?.in && !n?.motion?.out) return toast('Zaznacz element z presetem wejścia lub wyjścia', true);
    const rest = {};
    for (const p of ['x', 'y', 'opacity', 'scale', 'skewX', 'blur', 'clipL', 'clipT', 'clipR', 'clipB']) rest[p] = +(n.props?.[p] ?? PROPS[p].d) || 0;
    const r = MO.motionToKeys(n.motion, { rest, outStart: outStartOf(), shift: MO.sequenceShifts(scene.nodes).get(n.id) || 0 });
    const clash = Object.keys(r.anim).filter((p) => n.anim?.[p]?.length);
    if (clash.length) return toast(`Na klucze: węzeł ma już klucze (${clash.join(', ')}) – usuń je albo zostań przy presecie`, true);
    if (!r.done.length) return showReport('Na klucze – nic nie zamieniono', r.skipped);
    checkpoint();
    n.anim = { ...(n.anim || {}), ...r.anim };
    for (const k of r.done) delete n.motion[k];
    if (!n.motion.textIn && !n.motion.textOut) delete n.motion.after;
    if (!Object.keys(n.motion).length) delete n.motion;
    seqMode = false; try { localStorage.setItem('vizrs.seq', '0'); } catch { /* ignoruj */ }
    if (r.skipped.length) showReport('Na klucze – część pominięta', r.skipped); else toast('Presety zamienione na klucze – widok kluczy');
  } else if (act === 'fromkeys') {
    if (!n || !MO.MOTION_PROPS.some((p) => n.anim?.[p]?.length >= 2)) return toast('Zaznacz element z kluczami położenia, krycia, skali, skosu, rozmycia lub przycięcia', true);
    if (n.motion?.in || n.motion?.out) return toast('Z kluczy: element ma już preset wejścia/wyjścia – usuń go najpierw', true);
    const defaults = Object.fromEntries(MO.MOTION_PROPS.map((p) => [p, PROPS[p].d]));
    const opt = { props: n.props || {}, defaults, sample: (p, t) => +trackValue(n.anim[p], t, 'num') || 0, outStart: outStartOf(), shift: MO.sequenceShifts(scene.nodes).get(n.id) || 0 };
    let r = MO.keysToMotion(n.anim, opt);
    if (r.skipped.length) {
      const a = MO.keysToMotion(n.anim, { ...opt, approx: true });
      if (a.approx.length && await confirmBox(`Części kluczy nie da się zapisać dokładnie presetem:\n${a.approx.join('\n')}`, { title: 'Zamienić w przybliżeniu?', ok: 'Zamień' })) r = a;

}

function setProp(n, p, v) {

  else { n.props ||= {}; n.props[p] = v; }
}
/** Zmiana z panelu: przy blokadzie proporcji szerokość i wysokość zmieniają się razem. Przy kilku zaznaczonych – wszystkim,
 *  które mają tę właściwość: położenie x / y przesuwa się o tyle samo (układ zostaje), inne właściwości dostają tę samą wartość. */
function setPropUI(n, p, v) {

    if ((p === 'x' || p === 'y') && typeof v === 'number' && Number.isFinite(old)) setPropOne(m, p, Math.round((+propAt(m, p, t, null) + v - old) * 1000) / 1000);

}

    + (it.over ? '<span class="bad" title="Tekst wymaga ściśnięcia poniżej granicy (min. ściśnięcie) – wystaje poza ramkę">⚠︎ nie mieści się</span>' : '');

function parseVal(p, inp) {

$('#props').addEventListener('focusin', () => { pendingCP = true; lastArea = 'props'; });
$('#props').addEventListener('input', onPropInput);

function cp() { if (pendingCP) { checkpoint(); pendingCP = false; } else setDirty(true); }

    return;
  }
  const n = selNode();
  if (n && (inp.dataset.mobg !== undefined || inp.dataset.moorg !== undefined)) {

    if (v) (n.motion ||= {})[key] = v; else if (n.motion) { delete n.motion[key]; if (!Object.keys(n.motion).length) delete n.motion; }

    if (v === '' || (key === 'type' && v === 'none' && sec !== 'in' && sec !== 'out')) {

    } else s[key] = v;
    if (key === 'type' && s.type && (sec === 'in' || sec === 'out') && s.dur == null) Object.assign(s, { dur: 0.5, ease: sec === 'out' ? 'power2.in' : 'power2.out', ...(MO.DIR_TYPES.has(s.type) && !s.dir ? { dir: 'left' } : {}) });

    if (n.type === 'ticker' && (inp.dataset.p === 'tickerMode' || (inp.dataset.p === 'catColors' && e.type === 'change'))) { renderProps(); return; }
    if (e.type === 'change' && WHEN_SRC.has(inp.dataset.p)) { renderProps(); return; }

/**

async function placeFile(f) {

function addNode(type) {

  const c = structuredClone(n);

function treeOp(op) {
  const L = selId && locate(selId); if (!L) return;
  const { node: n, list, index: i, parent } = L;
  // włóż / wyjmij = przeniesienie z zachowaniem położenia na ekranie (moveNode robi własny punkt cofania)
  if (op === 'in') { if (i > 0 && TYPES[list[i - 1].type]?.children) moveNode(n.id, list[i - 1].id, 'into'); return; }
  if (op === 'out') { if (parent) moveNode(n.id, parent.id, 'after'); return; }
  if (op === 'group') return groupSel();
  if (op === 'ungroup') return ungroupSel();
  checkpoint();
  if (op === 'up' && i > 0) [list[i - 1], list[i]] = [list[i], list[i - 1]];
  else if (op === 'down' && i < list.length - 1) [list[i + 1], list[i]] = [list[i], list[i + 1]];
  else if (op === 'dup') {
    const copies = [];
    for (const id of topSel()) {
      const D = locate(id), c = cloneNode(D.node); c.name = D.node.name + '_kopia';
      D.list.splice(D.index + 1, 0, c); copies.push(c.id);
    }
    selId = copies[0] || null; selMore = copies.slice(1);
  } else if (op === 'fit') {
    if (!fitGroup(n)) { undo.pop(); return toast('Dopasowanie działa dla grupy z elementami', true); }
  } else if (op === 'del') {
    const ids = topSel();
    if (ids.some(isLocked)) { undo.pop(); return toast('Element jest zablokowany – odblokuj go w drzewie (🔒)', true); }
    for (const id of ids) { const D = locate(id); if (D) D.list.splice(D.index, 1); }
    selId = null; selMore = []; selKey = null;
  } else { undo.pop(); return; }
  player.setScene(scene); player.seek(t);
  renderTree(); renderProps(); renderTimeline();
}

function groupSel() {

async function importFile(f) {

      if (!kind) throw new Error('to nie jest paczka .cgpack');
      return importPack(await PACK.readPack(u8));

// Alt przytrzymany nad kanwą = pomiar odległości (puszczenie albo utrata fokusu okna – koniec)
const setMeasure = (v) => { if (measureOn !== v) { measureOn = v; drawGuides(); } };
addEventListener('keydown', (e) => {
  if (e.key === 'Alt' && !e.repeat && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) && lastArea === 'canvas') { e.preventDefault(); setMeasure(true); }
});
addEventListener('keyup', (e) => { if (e.key === 'Alt') { if (measureOn) e.preventDefault(); setMeasure(false); } });
addEventListener('blur', () => setMeasure(false));
addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
  if (typing) return;
  if (e.key === '/' && !mod && selNode()) { e.preventDefault(); $('#psearch').focus(); $('#psearch').select(); return; }
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); doRedo(); return; }
  if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); treeOp('dup'); return; }
  if (mod && e.key.toLowerCase() === 'g') { e.preventDefault(); treeOp(e.shiftKey ? 'ungroup' : 'group'); return; }
  if (e.key === 'Escape' && !$('#ctxMenu').hidden) { ctxClose(); return; }
  if (dockPv && (e.key === 'Escape' || (e.key === 'Enter' && dockPv.set))) { e.preventDefault(); dockEnd(e.key === 'Enter'); return; }
  if (e.key === 'Escape') {
    const open = $$('.vpop').filter((x) => !x.hidden);
    if (open.length) open.forEach((x) => { x.hidden = true; }); else if (selId) select(null);
    return;
  }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); if (lastArea === 'timeline' && selKey) deleteSelKey(); else treeOp('del'); return; }
  if (e.key === ' ') { e.preventDefault(); if (player.playing) player.playing = false; else $('#pPlay').click(); return; }
  if (mod && e.key.toLowerCase() === 'c' && lastArea === 'timeline') { e.preventDefault(); copyKeys(); return; }
  if (mod && e.key.toLowerCase() === 'v' && lastArea === 'timeline') { e.preventDefault(); pasteKeys(); return; }
  if (mod && !e.shiftKey && lastArea !== 'timeline' && lastArea !== 'props') {
    const kk = e.key.toLowerCase();
    if (kk === 'c' && selId) { e.preventDefault(); copyNodes(false); return; }
    if (kk === 'x' && selId) { e.preventDefault(); copyNodes(true); return; }
    if (kk === 'v') { e.preventDefault(); pasteNodes(); return; }
    if (kk === 'a') { e.preventDefault(); selectAllNodes(); return; }
  }
  if (e.key.toLowerCase() === 'm' && !mod) { e.preventDefault(); addMarker(t); return; }
  if (e.shiftKey && !mod && e.code === 'Digit1') { e.preventDefault(); resetView(); return; }
  if (e.shiftKey && !mod && !e.altKey && e.code === 'KeyR') { e.preventDefault(); toggleRefs(); return; }
  if (e.shiftKey && !mod && e.code === 'Digit2') { e.preventDefault(); zoom100(); return; }
  if (e.shiftKey && !mod && e.code === 'Digit3') { e.preventDefault(); zoomSel(); return; }
  if (e.key === 'Home') { setTime(0); return; }
  if (e.key === 'End') { setTime(scene.duration); return; }
  const n = selNode();
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (dockPv?.set && arrows[e.key] && lastArea !== 'timeline') {
    e.preventDefault();
    const m = e.shiftKey ? 10 : 1, [dx, dy] = arrows[e.key];
    dockPv.dx += dx * m; dockPv.dy += dy * m; dockPlay(false); return;
  }
  if (!n && arrows[e.key] && lastArea !== 'timeline') {
    e.preventDefault(); checkpoint();
    const m = e.shiftKey ? 10 : 1, [dx, dy] = arrows[e.key];
    setSceneOffset((+scene.x || 0) + dx * m, (+scene.y || 0) + dy * m); return;
  }
  if (n && arrows[e.key]) {
    // całe zaznaczenie, w układzie rodzica każdego elementu (zablokowane zostają)
    const ms = topSel().filter((id) => !isLocked(id)).map((id) => locate(id).node);
    if (!ms.length) return;
    e.preventDefault(); checkpoint();
    const m = e.shiftKey ? 10 : 1, [dx, dy] = arrows[e.key];
    for (const x of ms) { setProp(x, 'x', propAt(x, 'x', t, null) + dx * m); setProp(x, 'y', propAt(x, 'y', t, null) + dy * m); }
    refresh(); syncProps();
  }
});

  d.innerHTML = box(`<div class="dim" style="margin:4px 0 10px;font-size:12px">Sceny trafiają na serwer razem z grafikami i czcionkami, których brakuje na serwerze
      (pliku o tej samej nazwie nie nadpisuje). Strony w Trio korzystające ze sceny pokażą nową wersję.</div>
    <div class="row" style="gap:6px;margin-bottom:8px"><label>Serwer</label><select id="dpSrv" class="grow">${servers.map((s) => `<option value="${esc(s.url)}" ${s.url === remembered ? 'selected' : ''}>${esc(s.url)}${s.hasToken ? '' : ' (bez zapamiętanego tokenu)'}</option>`).join('')}</select></div>
    <div class="row" style="gap:6px;margin-bottom:6px"><button data-dp="all">zaznacz wszystkie</button><button data-dp="none">żadna</button></div>
    <div id="dpList" style="max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 8px">${scenes.map((s) => `<label style="display:flex;gap:8px;align-items:center;padding:3px 0" data-row="${esc(s.id)}"><input type="checkbox" value="${esc(s.id)}" ${scene && s.id === scene.id ? 'checked' : ''}><span class="grow">${esc(s.name)}</span><span class="dim dpSt" style="font-size:11px"></span></label>`).join('')}</div>
    <div id="dpMsg" class="dim" style="margin:8px 0;font-size:12px"></div>
    <div class="row" style="gap:6px"><button id="dpGo" class="acc" disabled>⇧ Wyślij</button><button id="dpNo">Anuluj</button></div>`);
  document.body.appendChild(d);
  const picked = () => [...d.querySelectorAll('#dpList input[type=checkbox]:not(.dpOver):checked')].map((c) => c.value);
  let checked = null, seq = 0;
  const check = async () => {
    const my = ++seq, ids = picked(), server = $('#dpSrv', d).value;
    checked = null; $('#dpGo', d).disabled = true;
    for (const st of d.querySelectorAll('.dpSt')) st.textContent = '';
    if (!ids.length) { $('#dpMsg', d).textContent = 'Zaznacz sceny do wysłania.'; return; }
    $('#dpMsg', d).textContent = 'Sprawdzam serwer…';
    try {
      const r = await api('POST', '/api/deploy/check', { server, scenes: ids });
      if (my !== seq) return;
      checked = r;
      for (const sc of r.scenes) {
        const row = d.querySelector(`[data-row="${CSS.escape(sc.id)}"]`); if (!row) continue;
        const [txt, cls] = DEPLOY_STATUS[sc.status] || [sc.status, ''];
        const air = sc.onAir?.length ? ` · <b style="color:#e55">NA ANTENIE (${sc.onAir.map(esc).join(', ')})</b>` : '';
        const over = cls ? ` <label title="Zastąp wersję na serwerze"><input type="checkbox" class="dpOver" data-over="${esc(sc.id)}"> nadpisz</label>` : '';
        row.querySelector('.dpSt').innerHTML = `<span style="${cls ? 'color:var(--warn,#e8b04b)' : ''}">${esc(txt)}</span>${air}${over}`;
      }
      const need = r.scenes.flatMap((sc) => PACK.sceneAssets(scenes.find((s) => s.id === sc.id) || {}, known)).filter((n, i, a) => a.indexOf(n) === i);
      const missing = need.filter((n) => !r.assets.includes(n));
      $('#dpMsg', d).textContent = `${r.scenes.length} scen · zasoby: ${need.length}, do wysłania ${missing.length}`;
      $('#dpGo', d).disabled = false;
    } catch (e) { if (my === seq) $('#dpMsg', d).textContent = 'Błąd: ' + e.message; }
  };
  d.addEventListener('change', (e) => { if (!e.target.classList.contains('dpOver')) check(); });
  d.addEventListener('click', async (e) => {
    const b = e.target.dataset.dp;
    if (b) { for (const c of d.querySelectorAll('#dpList input[type=checkbox]:not(.dpOver)')) c.checked = b === 'all'; return check(); }
    if (e.target.id === 'dpNo') return d.remove();
    if (e.target.id !== 'dpGo' || !checked) return;
    const blocked = checked.scenes.filter((sc) => (sc.status === 'changed' || sc.status === 'foreign') && !d.querySelector(`[data-over="${CSS.escape(sc.id)}"]`)?.checked);
    const air = checked.scenes.filter((sc) => sc.onAir?.length);
    if (air.length && !(await confirmBox(`Na antenie: ${air.map((sc) => sc.name).join(', ')}.\nGrafika na wizji zmieni się przy następnym TAKE/aktualizacji.`, { title: 'Wysłać sceny będące na antenie?', ok: 'Wyślij' }))) return;
    const send = checked.scenes.filter((sc) => !blocked.includes(sc)).map((sc) => ({
      id: sc.id, assets: PACK.sceneAssets(scenes.find((s) => s.id === sc.id) || {}, known),
      overwrite: !!d.querySelector(`[data-over="${CSS.escape(sc.id)}"]`)?.checked,
    }));
    if (!send.length) return toast('Zaznaczone sceny zmieniono na serwerze – zaznacz „nadpisz”, by je zastąpić', true);
    $('#dpGo', d).disabled = true; $('#dpMsg', d).textContent = 'Wysyłam…';
    try {
      const r = await api('POST', '/api/deploy', { server: checked.server, scenes: send });
      try { localStorage.setItem('vizrs.deploy', checked.server); } catch { /* ignoruj */ }
      const name = (id) => scenes.find((s) => s.id === id)?.name || id;
      const lines = r.results.map((x) => x.ok
        ? `„${name(x.id)}”: wysłano${x.uploaded.length ? `, zasoby: ${x.uploaded.join(', ')}` : ''}${x.skipped.length ? ` (już na serwerze: ${x.skipped.join(', ')})` : ''}${x.renamed?.length ? `; na serwerze pod inną nazwą: ${x.renamed.map(([a, b]) => `${a} → ${b}`).join(', ')}` : ''}${x.warning ? ` – uwaga: ${x.warning}` : ''}`
        : `„${name(x.id)}”: ${x.conflict ? 'zmieniona na serwerze w międzyczasie – nie wysłano (sprawdź i zaznacz „nadpisz”)' : x.error}`);
      for (const sc of blocked) lines.push(`„${sc.name}”: pominięto – zmieniona na serwerze (nie zaznaczono „nadpisz”)`);
      const ok = r.results.filter((x) => x.ok).length;
      d.remove();
      showReport(`Wysłano na ${r.server}: ${ok} z ${send.length + blocked.length} scen`, lines);
    } catch (err) { $('#dpMsg', d).textContent = 'Błąd: ' + err.message; $('#dpGo', d).disabled = false; }
  });
  check();
}
$('#bDeploy').onclick = () => deployDialog();

// ------------------------------------------------------------ połączenie z serwerem
// tylko wskaźnik (edycja sceny nie jest nadpisywana zdarzeniami); okno aplikacji `vizrs artist` wie dzięki temu, że Artist jest otwarty
// warstwa zmieniona w Trio: bez tego otwarta scena przywróciłaby starą przy zapisie (`rev` – tylko gdy nikt nie zmienił nic więcej)
function layerChanged(ev) {
  const held = scenes.find((s) => s.id === ev.id);
  for (const s of new Set([held, scene?.id === ev.id ? scene : null])) if (s && s.rev === ev.rev - 1) { s.layer = ev.layer; s.rev = ev.rev; }
  renderSceneSel(); renderTree(); buildRefs();
  const inp = $('[data-sp="layer"]'); if (inp && scene?.id === ev.id) inp.value = scene.layer;
}
connectEvents((ev) => { if (ev.t === 'show' && ev.kind === 'scenes' && ev.layer) layerChanged(ev); }, (ok) => {
  $('#conn').textContent = ok ? 'połączono' : 'brak połączenia';
  $('#conn').className = 'pill ' + (ok ? 'ok' : 'on');
});
</script>
</body>
