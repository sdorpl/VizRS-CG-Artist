[package]
name = "vizrs-cg-artist"
version = "0.3.0"
edition = "2021"
description = "VizRS CG Artist – edytor grafik i animacji VizRS (Tauri 2: Linux, Windows, macOS)"
repository = "https://github.com/sdorpl/VizRS-CG-Artist"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
# klient HTTP(S) do serwera vizrs (wysyłka, okno połączenia, praca na serwerze przez pośrednika): czysty Rust, TLS rustls
ureq = { version = "3", default-features = false, features = ["rustls"] }
# sekret magazynu lokalnego z generatora systemu (Linux, Windows, macOS)
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# pisownia polska w WebKitGTK – ta sama wersja, której używa wry
webkit2gtk = "2.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
