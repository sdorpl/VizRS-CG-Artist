# vizrs-cg-artist – edytor scen i animacji VizRS na Tauri 2 (okno: klient, nie serwer anteny).
#
# Dozwolone zależności (wyjątek od zasady pakietu „zero zależności” – decyzje użytkownika z planu
# VizRS CG System PLAN-artist-osobny.md; nowa zależność to decyzja użytkownika):
#   tauri, tauri-plugin-dialog, tauri-plugin-single-instance, serde_json, ureq (rustls), getrandom,
#   vizrs-model (git, tag VizRS CG System), na Linuksie webkit2gtk; tauri-build (budowa).
# Uzasadnienie każdej – komentarz przy wierszu niżej.

[package]
name = "vizrs-cg-artist"
version = "26.11.12"
license = "MIT"
edition = "2021"
description = "VizRS CG Artist – edytor grafik i animacji VizRS (Tauri 2: Linux, Windows, macOS)"
repository = "https://github.com/sdorpl/VizRS-CG-Artist"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
# klient HTTP(S) do serwera vizrs (wysyłka, okno połączenia, praca na serwerze przez pośrednika): czysty Rust, TLS rustls
ureq = { version = "3", default-features = false, features = ["rustls"] }
# sekret magazynu lokalnego z generatora systemu (Linux, Windows, macOS)
getrandom = "0.3"
# format show VizRS (JSON, walidacja jak w serwerze `vizrs`) – crate z VizRS CG System, bez zależności
# (plan wydzielenia Artist, A1 i decyzja 3: zależność git z tagiem CG System)
vizrs-model = { git = "https://github.com/sdorpl/VizRS-CG-System", tag = "v26.11.12" }

[target.'cfg(target_os = "linux")'.dependencies]
# pisownia polska w WebKitGTK – ta sama wersja, której używa wry
webkit2gtk = "2.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
