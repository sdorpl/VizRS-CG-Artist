[package]
name = "vizrs-cg-artist-tauri"
version = "0.2.0"
edition = "2021"
description = "Prototyp: VizRS CG Artist na Tauri 2 (Linux, Windows, macOS)"
publish = false

[[bin]]
name = "vizrs-cg-artist-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"

[profile.release]
strip = true
lto = "thin"
